app-id: com.bolwarratechnologies.this_note
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: this_note

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: this_note_linux
    buildsystem: simple
    build-commands:
      - install -Dm755 this_note /app/lib/this_note/this_note
      - cp -ra lib /app/lib/this_note/lib
      - install -d /app/share/this_note
      - cp -ra data/. /app/share/this_note/
      - ln -s /app/share/this_note /app/lib/this_note/data
      - install -Dm755 this_note_wrapper.sh /app/bin/this_note
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 LICENSE -t /app/share/licenses/${FLATPAK_ID}/this_note
    sources:
      - type: archive
        url: https://github.com/Perszus/this-note-linux/releases/download/v2.0.0/this_note_linux_v2.0.0.tar.xz
        sha256: 5df9233ba63aaeffd0d0fc630af40723afa811fa700467d997dd017c976186b0
      - type: script
        dest-filename: this_note_wrapper.sh
        commands:
          - exec /app/lib/this_note/this_note "$@"
